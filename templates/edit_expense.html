{% extends "base.html" %}

{% block title %}Edit Expense | ExpenseFlow{% endblock %}
{% block heading %}Edit Expense{% endblock %}

{% block content %}
<section class="panel expense-form-panel">
    <div class="panel-heading">
        <div>
            <h3>Edit your expense</h3>
            <p>Update the details below. Expense #{{ expense["id"] }}</p>
        </div>
    </div>

    <form method="POST" action="{{ url_for('edit_expense', expense_id=expense['id']) }}" class="expense-form">
        <div class="form-group">
            <label for="title">Expense name</label>
            <input id="title" name="title" type="text" maxlength="100" required
                   value="{{ expense['title'] }}">
        </div>

        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input id="amount" name="amount" type="number" step="0.01" min="0.01" required
                   value="{{ expense['amount'] }}">
        </div>

        <div class="form-group">
            <label for="category_id">Category</label>
            <select id="category_id" name="category_id" required>
                {% for category in categories %}
                <option value="{{ category['id'] }}"
                        {% if expense['category_id'] == category['id'] %}selected{% endif %}>
                    {{ category['icon'] }} {{ category['name'] }}{% if category['is_archived'] %} (archived){% endif %}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="expense_date">Date</label>
            <input id="expense_date" name="expense_date" type="date" required
                   value="{{ expense['expense_date'] }}">
        </div>

        <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="3">{{ expense['notes'] or '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="primary-button">Save Changes</button>
            <a href="{{ url_for('expense_list') }}" class="secondary-button">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
